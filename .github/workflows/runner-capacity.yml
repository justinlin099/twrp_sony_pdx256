name: Inspect standard runner capacity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Measure and reclaim standard runner disk space
        shell: bash
        run: |
          printf 'Runner image: %s %s\n' "$ImageOS" "$ImageVersion"
          df -B1 / /mnt
          free -b
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/local/lib/node_modules /usr/local/share/chromium
          df -B1 / /mnt
      - name: Test sparse partial toolchain downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/toolchain-probe"
          cd "$RUNNER_TEMP/toolchain-probe"
          git clone --filter=blob:none --no-checkout --depth=1 --branch android-14.0.0_r67 https://android.googlesource.com/platform/prebuilts/rust rust
          git -C rust sparse-checkout set --cone linux-x86/1.75.0
          git -C rust checkout --detach 4ebcd0d4c717e312c2773f4019e0874b994ac2b8
          test "$(git -C rust rev-parse HEAD)" = 4ebcd0d4c717e312c2773f4019e0874b994ac2b8
          git clone --filter=blob:none --no-checkout --depth=1 --branch android-14.0.0_r67 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang
          git -C clang sparse-checkout set --cone clang-r510928
          git -C clang checkout --detach 7154d3eddcb62ff7909a6ae2bf0c03e445e65bc4
          test "$(git -C clang rev-parse HEAD)" = 7154d3eddcb62ff7909a6ae2bf0c03e445e65bc4
          du -s -B1 rust clang
          du -s -B1 rust/.git clang/.git
          rust/linux-x86/1.75.0/bin/rustc --version
          clang/clang-r510928/bin/clang --version
          df -B1 /
