name: Build TWRP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twrp-pdx256-build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out build integration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: port
          persist-credentials: false

      - name: Read companion revisions
        id: pins
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          entries = json.loads(Path('port/trees.lock.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for entry in entries:
                  kind = entry['path'].split('/')[0]
                  print(f"{kind}={entry['revision']}", file=output)
          PY

      - name: Check out device tree
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: justinlin099/android_device_sony_pdx256
          ref: ${{ steps.pins.outputs.device }}
          path: port/device/sony/pdx256
          ssh-key: ${{ secrets.DEVICE_REPO_SSH_KEY }}
          persist-credentials: false

      - name: Check out vendor tree
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: justinlin099/android_vendor_sony_pdx256
          ref: ${{ steps.pins.outputs.vendor }}
          path: port/vendor/sony/pdx256
          ssh-key: ${{ secrets.VENDOR_REPO_SSH_KEY }}
          persist-credentials: false

      - name: Prepare runner
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          mkdir -p "$RUNNER_TEMP/artifacts"
          python3 port/tools/checkout-trees.py
          python3 port/tools/prepare-factory.py
          df -h /
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/local/lib/node_modules /usr/local/share/chromium /usr/lib/jvm /opt/az /usr/local/share/boost /opt/microsoft /opt/google/chrome
          sudo bash port/tools/install-build-deps.sh
          sudo apt-get clean
          df -B1 / | tee "$RUNNER_TEMP/artifacts/initial-disk.txt"
          free -b | tee "$RUNNER_TEMP/artifacts/initial-memory.txt"
          python3 - <<'PY'
          import shutil
          free = shutil.disk_usage('/').free
          if free < 45 * 1024**3:
              raise SystemExit(f'Insufficient disk space after cleanup: {free / 1024**3:.1f} GiB')
          PY

      - name: Download pinned source
        run: |
          set -o pipefail
          bash port/tools/ci-source.sh "$RUNNER_TEMP/source" "$RUNNER_TEMP/artifacts" 2>&1 | tee "$RUNNER_TEMP/artifacts/sync.log"

      - name: Compile and verify recovery
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
          GOMEMLIMIT: 8GiB
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, shutil
          if shutil.disk_usage(os.environ['RUNNER_TEMP']).free < 14 * 1024**3:
              raise SystemExit('Need 14 GiB free for build output and additional swap')
          PY
          test ! -e "$RUNNER_TEMP/twrp-build.swap"
          sudo install -m 600 /dev/null "$RUNNER_TEMP/twrp-build.swap"
          sudo fallocate -l 4G "$RUNNER_TEMP/twrp-build.swap"
          sudo mkswap "$RUNNER_TEMP/twrp-build.swap"
          sudo swapon "$RUNNER_TEMP/twrp-build.swap"
          while true; do
            {
              date -u +%FT%TZ
              df -B1 /
              free -b
              ps -C soong_build -o pid,rss,vsz,etime,comm || true
            } | tee -a "$RUNNER_TEMP/artifacts/resources.log"
            sleep 30
          done &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          /usr/bin/time -v bash port/build.sh "$RUNNER_TEMP/source" "$RUNNER_TEMP/artifacts/recovery.img" 2 2>&1 | tee "$RUNNER_TEMP/artifacts/build.log"
          cd "$RUNNER_TEMP/artifacts"
          sha256sum recovery.img | tee recovery.img.sha256
          cat recovery.json >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare named release assets
        id: release
        run: python3 port/tools/prepare-release.py "$RUNNER_TEMP/artifacts" --version 3.7.1_14

      - name: Upload build and diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: twrp-pdx256-${{ github.run_number }}
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ steps.release.outputs.name }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          assets=(
            "$RUNNER_TEMP/artifacts/$RELEASE_NAME.img"
            "$RUNNER_TEMP/artifacts/$RELEASE_NAME.img.sha256"
            "$RUNNER_TEMP/artifacts/$RELEASE_NAME.json"
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_NAME" --notes-file "$RUNNER_TEMP/artifacts/release-notes.md" --latest
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME" --notes-file "$RUNNER_TEMP/artifacts/release-notes.md" --latest
          fi
